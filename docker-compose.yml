services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nest-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=file:/usr/src/app/prisma/dev.db
    volumes:
      - backend-db:/usr/src/app/prisma

  frontend:
    build:
      context: ./fronted
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    container_name: next-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  backend-db:
